name: HerobrineAI
version: '1.0.0'
main: com.herobrineai.HerobrineAI
api-version: '1.20'
author: NexoDevx
description: Plugin de IA de terror avançado e comportamental do Herobrine para Minecraft Paper.

commands:
  herobrine:
    description: Comando principal do plugin HerobrineAI
    usage: /herobrine <subcomando>
    permission: herobrineai.admin
    permission-message: §cVocê não tem permissão para usar este comando.

permissions:
  herobrineai.admin:
    description: Permite utilizar todos os comandos administrativos do HerobrineAI
    default: op
